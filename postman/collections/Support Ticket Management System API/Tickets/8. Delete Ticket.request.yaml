$kind: http-request
description: Deletes a ticket.
url: "{{base_url}}/tickets/{{ticket_id}}"
method: DELETE
auth:
  type: bearer
  credentials:
    token: "{{agent_token}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 204 No Content', function () {
          pm.response.to.have.status(204);
      });
    language: text/javascript
order: 8000
