$kind: http-request
description: Verifies that unauthenticated requests to protected endpoints return 401.
url: "{{base_url}}/tickets"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 401 Unauthorized', function () {
          pm.response.to.have.status(401);
      });
    language: text/javascript
order: 1000
