$kind: http-request
description: Verifies that accessing a non-existent ticket returns a 404 error.
url: "{{base_url}}/tickets/999999"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{customer_token}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 404 Not Found', function () {
          pm.response.to.have.status(404);
      });
    language: text/javascript
order: 5000
